<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay</title>
<style>html,body{margin:0;height:100%;background:var(--bg,transparent);overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}</style>
</head><body><canvas id="c" aria-hidden="true"></canvas>
<script>
// MicroSlats (preset "swell") di Ponte: stessi shader del componente, senza fluido. Parametri: ?light=1 &bg=RRGGBB
const params = new URLSearchParams(location.search);
let light = params.get('light') === '1';
const ink = params.get('ink') === '1';
if (ink) document.documentElement.style.setProperty('--bg', 'linear-gradient(180deg,#6FB4FF 0%,#3C7BFF 50%,#2547F0 100%)');
else if (params.get('bg')) document.documentElement.style.setProperty('--bg', '#' + params.get('bg'));
const S = { scale: 1.5, speed: 0.6, direction: 250, chop: 0.55, stretch: 0, glint: 0.7, contrast: 1.25, perspective: 0.55, fog: 0.55,
  slatW: 10, slatH: 25, gap: 3, round: 0.75, introDuration: 1.5 };
const VERT = `#version 300 es
void main(){ vec2 p = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0); gl_Position = vec4(p, 0.0, 1.0); }`;
const FIELD = `#version 300 es
precision highp float;
uniform vec2 uSize;
uniform vec4 uGrid;
uniform vec2 uOrigin;
uniform vec2 uSlat;
uniform float uTime;
uniform float uScale;
uniform float uDirection;
uniform float uChop;
uniform float uStretch;
uniform float uGlint;
uniform float uContrast;
uniform float uPerspective;
uniform float uFog;
uniform float uIntro;
uniform sampler2D tVelocity;
uniform sampler2D tInk;
uniform vec2 uFluidTexel;
uniform float uFluid;
uniform float uInk;
uniform float uLean;
out vec4 fragColor;

const float TURN[4] = float[4](0.0, -0.95, 0.78, 1.62);
const float LENGTH[4] = float[4](2.6, 1.7, 1.12, 0.76);
const float HEIGHT[4] = float[4](1.0, 0.75, 0.5, 0.3);
const float SHIFT[4] = float[4](0.0, 2.3, 4.1, 1.1);

void main() {
  vec2 cell = floor(gl_FragCoord.xy);
  float row = uGrid.y - 1.0 - cell.y;
  vec2 center = uOrigin + vec2(cell.x, row) * uGrid.zw + uSlat * 0.5;
  float v = clamp(center.y / uSize.y, 0.0, 1.0);

  vec2 flow = vec2(0.0);
  float ink = 0.0;
  if (uFluid > 0.5) {
    vec2 fluidUv = clamp(vec2(center.x / uSize.x, 1.0 - center.y / uSize.y), 0.0, 1.0);
    flow = texture(tVelocity, fluidUv).xy * uFluidTexel * uSize;
    ink = texture(tInk, fluidUv).x;
  }

  float horizon = mix(8.0, 0.5, uPerspective);
  float depth = (1.0 + horizon) / (v + horizon);
  vec2 world = vec2((center.x - uSize.x * 0.5) / uSize.y * depth, (depth - 1.0) * horizon * 2.2);
  world -= flow * 0.00018 * depth;
  world /= max(uScale, 0.05);

  float meander = 0.55 * sin(dot(world, vec2(0.23, 0.41)) * 0.9 + uTime * 0.13)
    + 0.3 * sin(dot(world, vec2(-0.37, 0.19)) * 1.4 - uTime * 0.09);

  float steep = uChop * 0.45;
  float height = 0.0;
  float total = 0.0;
  for (int i = 0; i < 4; i++) {
    float angle = uDirection + TURN[i];
    vec2 heading = vec2(cos(angle), sin(angle));
    float k = 6.2831853 / LENGTH[i];
    float omega = sqrt(9.81 * k) * 0.35;
    float theta = k * dot(world, heading) - omega * uTime + SHIFT[i] + meander * (0.6 + 0.3 * float(i));
    height += HEIGHT[i] * (cos(theta) + steep * cos(2.0 * theta));
    total += HEIGHT[i] * (1.0 + steep);
  }
  float level = clamp(0.5 + 0.5 * height / (total * 0.85), 0.0, 1.0);
  float crest = smoothstep(0.6, 1.0, level);
  float glint = crest * crest * uGlint;

  float haze = mix(1.0, 1.0 - uFog, pow(1.0 - v, 1.4));
  float light = (pow(level, uContrast) + glint * 0.8) * haze;
  float glow = 1.0 - exp(-max(ink, 0.0) * uInk * 1.6);
  light = 1.0 - (1.0 - clamp(light, 0.0, 1.0)) * (1.0 - glow);

  float front = uIntro * 1.35;
  float reveal = 1.0 - smoothstep(front - 0.35, front, v);
  float sweep = exp(-pow((v - front + 0.22) / 0.07, 2.0)) * (1.0 - uIntro);
  light = (light + sweep * 0.8) * reveal;
  light = max(light, 0.045 * reveal);
  float span = mix(1.0 - uStretch, 1.0, level) + glow * 0.3;
  span = clamp(span, 0.08, 1.0) * mix(0.1, 1.0, reveal);
  float tint = clamp(max(glint * 1.4, glow * 0.9) + sweep, 0.0, 1.0);
  float lean = clamp(flow.x / 1400.0, -1.0, 1.0) * uLean * reveal;

  fragColor = vec4(clamp(light, 0.0, 1.0), span, tint, 0.5 + 0.5 * lean);
}
`;
const SLAT = `#version 300 es
precision highp float;
uniform sampler2D tField;
uniform vec2 uSize;
uniform float uDpr;
uniform vec4 uGrid;
uniform vec2 uOrigin;
uniform vec2 uSlat;
uniform float uRound;
uniform float uTilt;
uniform vec3 uColor;
uniform vec3 uGlintColor;
uniform vec4 uBackground;
out vec4 fragColor;

float pill(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uSize.y * uDpr - gl_FragCoord.y) / uDpr;
  vec2 local = p - uOrigin;
  vec2 cell = floor(local / uGrid.zw);
  vec4 background = vec4(uBackground.rgb * uBackground.a, uBackground.a);
  vec4 slat = vec4(0.0);
  int reach = uTilt > 0.0 ? 1 : 0;
  for (int dx = -1; dx <= 1; dx++) {
    if (abs(dx) > reach) continue;
    vec2 neighbour = cell + vec2(float(dx), 0.0);
    if (neighbour.x < 0.0 || neighbour.y < 0.0 || neighbour.x >= uGrid.x || neighbour.y >= uGrid.y) continue;
    vec4 field = texelFetch(tField, ivec2(int(neighbour.x), int(uGrid.y - 1.0 - neighbour.y)), 0);
    vec2 offset = local - neighbour * uGrid.zw - uSlat * 0.5;
    float angle = (field.a - 0.5) * 2.0 * uTilt;
    float c = cos(angle);
    float s = sin(angle);
    vec2 turned = vec2(c * offset.x + s * offset.y, c * offset.y - s * offset.x);
    vec2 halfSize = vec2(uSlat.x * 0.5, uSlat.y * 0.5 * field.g);
    float radius = uRound * min(halfSize.x, halfSize.y);
    float alpha = clamp(0.5 - pill(turned, halfSize, radius) * uDpr, 0.0, 1.0) * field.r;
    if (alpha > slat.a) slat = vec4(mix(uColor, uGlintColor, field.b) * alpha, alpha);
  }
  fragColor = slat + background * (1.0 - slat.a);
}
`;
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false });
const hex = h => [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255];
window.ponteSet = p => { if (p.lightMode !== undefined) light = !!p.lightMode; if (p.bg && !ink) document.documentElement.style.setProperty('--bg', '#' + String(p.bg).replace('#','')); };
if (gl) {
  const link = (vs, fs) => { const mk = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); return x; };
    const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
    const u = new Proxy({}, { get: (o, k) => (k in o ? o[k] : (o[k] = gl.getUniformLocation(p, k))) }); return { p, u }; };
  const field = link(VERT, FIELD), slat = link(VERT, SLAT);
  const vao = gl.createVertexArray();
  const blank = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, blank); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
  const fb = gl.createFramebuffer(); let tex = null, cols = 0, rows = 0;
  let W = 1, H = 1, dpr = 1, time = 0, intro = 0, last = 0;
  const resize = () => { W = Math.max(1, innerWidth); H = Math.max(1, innerHeight); dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); };
  addEventListener('resize', resize); resize();
  const frame = now => {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60; last = now;
    time += dt * S.speed; intro += dt / S.introDuration;
    const il = Math.min(intro, 1), ease = il < 0.5 ? 4 * il * il * il : 1 - Math.pow(-2 * il + 2, 3) / 2;
    const px = S.slatW + S.gap, py = S.slatH + S.gap;
    const c = Math.min(2048, Math.ceil((W + S.gap) / px) + 1), r = Math.min(2048, Math.ceil((H + S.gap) / py) + 1);
    const ox = (W - (c * px - S.gap)) / 2, oy = (H - (r * py - S.gap)) / 2;
    if (c !== cols || r !== rows) { if (tex) gl.deleteTexture(tex); tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, c, r); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0); cols = c; rows = r; }
    gl.bindVertexArray(vao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.viewport(0, 0, cols, rows); gl.useProgram(field.p); const f = field.u;
    gl.uniform2f(f.uSize, W, H); gl.uniform4f(f.uGrid, cols, rows, px, py); gl.uniform2f(f.uOrigin, ox, oy); gl.uniform2f(f.uSlat, S.slatW, S.slatH);
    gl.uniform1f(f.uTime, time); gl.uniform1f(f.uScale, S.scale); gl.uniform1f(f.uDirection, S.direction * Math.PI / 180); gl.uniform1f(f.uChop, S.chop);
    gl.uniform1f(f.uStretch, S.stretch); gl.uniform1f(f.uGlint, S.glint); gl.uniform1f(f.uContrast, S.contrast); gl.uniform1f(f.uPerspective, S.perspective);
    gl.uniform1f(f.uFog, S.fog); gl.uniform1f(f.uIntro, ease);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, blank); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, blank);
    gl.uniform1i(f.tVelocity, 0); gl.uniform1i(f.tInk, 1); gl.uniform2f(f.uFluidTexel, 1, 1); gl.uniform1f(f.uFluid, 0); gl.uniform1f(f.uInk, 1); gl.uniform1f(f.uLean, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(slat.p); const s = slat.u;
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, null); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(s.tField, 0); gl.uniform2f(s.uSize, W, H); gl.uniform1f(s.uDpr, dpr); gl.uniform4f(s.uGrid, cols, rows, px, py); gl.uniform2f(s.uOrigin, ox, oy);
    gl.uniform2f(s.uSlat, S.slatW, S.slatH); gl.uniform1f(s.uRound, S.round); gl.uniform1f(s.uTilt, 0);
    const col = hex(ink ? 'A9CFFF' : light ? '2F5FFF' : '5C9DFF'), gli = hex(ink ? 'FFFFFF' : light ? '1233C4' : 'CFE2FF');
    gl.uniform3f(s.uColor, col[0], col[1], col[2]); gl.uniform3f(s.uGlintColor, gli[0], gli[1], gli[2]); gl.uniform4f(s.uBackground, 0, 0, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!document.hidden) requestAnimationFrame(frame); else last = 0;
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) requestAnimationFrame(frame); });
  requestAnimationFrame(frame);
}
</script></body></html>
